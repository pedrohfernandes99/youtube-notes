<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <h1>YouTube Focus</h1>
  <p class="sub">Filtros de distração</p>

  <label class="toggle">
    <input type="checkbox" id="hideShorts">
    <span>Ocultar Shorts</span>
  </label>
  <label class="toggle">
    <input type="checkbox" id="hideComments">
    <span>Ocultar comentários</span>
  </label>
  <label class="toggle">
    <input type="checkbox" id="hideRecommended">
    <span>Ocultar recomendados (lateral)</span>
  </label>
  <label class="toggle">
    <input type="checkbox" id="hideEndscreen">
    <span>Ocultar tela final</span>
  </label>

  <hr>
  <p class="hint">Clique no botão 📝 no canto inferior direito do vídeo para abrir o painel de notas.</p>

  <script src="popup.js"></script>
</body>
</html>
